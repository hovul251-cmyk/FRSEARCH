<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FRSearch — Поиск тиммейтов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --card-bg: rgba(22, 26, 46, 0.7);
      --card-hover: rgba(30, 36, 64, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 15% 10%, rgba(99,102,241,0.18) 0%, transparent 40%),
                  radial-gradient(circle at 85% 90%, rgba(139,92,246,0.15) 0%, transparent 45%);
      pointer-events: none;
      z-index: -1;
    }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, textarea, select {
      width: 100%;
      background: rgba(15, 18, 33, 0.85);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    header {
      padding: max(14px, env(safe-area-inset-top)) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      z-index: 5;
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }

    .cat-btn {
      padding: 7px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .cat-btn:hover { border-color: var(--accent); color: var(--text); }

    .views { flex: 1; position: relative; overflow: hidden; }
    .view {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 14px 16px 90px;
      display: none;
    }
    .view.active { display: block; animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .mate-list { display: flex; flex-direction: column; gap: 10px; }
    .mate-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
      transition: background 0.2s, border-color 0.2s;
    }
    .mate-row:hover { background: var(--card-hover); border-color: rgba(99, 102, 241, 0.4); }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .mate-info { flex: 1; min-width: 0; }
    .mate-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
    }
    .mate-desc { font-size: 13px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-act {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .btn-act:active { transform: scale(0.96); }

    .tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(11, 13, 23, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 10;
    }
    .tab-btn {
      padding: 14px 0 12px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s;
    }
    .tab-btn.active { color: var(--accent); }

    #chat-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 50;
      display: none;
      flex-direction: column;
    }
    #chat-screen.on { display: flex; }
    .chat-header {
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 18, 33, 0.8);
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.mine { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.theirs { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }

    .chat-input-bar {
      padding: 12px 14px max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: rgba(11, 13, 23, 0.95);
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      box-shadow: 0 4px 18px var(--accent-glow);
    }
    .btn-main:active { transform: scale(0.98); }
    .empty-state { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">FR<span>Search</span></div>
    <button class="cat-btn" id="cat-selector">Все категории</button>
  </header>

  <main class="views">
    <section class="view active" id="view-feed">
      <div class="mate-list" id="feed-list"></div>
    </section>

    <section class="view" id="view-chats">
      <div class="mate-list" id="chats-list"></div>
    </section>

    <section class="view" id="view-profile">
      <div style="max-width: 480px; margin: 0 auto;">
        <div class="form-group">
          <label>Никнейм</label>
          <input type="text" id="prof-name" placeholder="Ваш никнейм" maxlength="30">
        </div>
        <div style="display: flex; gap: 10px;" class="form-group">
          <div style="flex: 1;">
            <label>Возраст</label>
            <input type="number" id="prof-age" placeholder="18" min="12" max="99">
          </div>
          <div style="flex: 1;">
            <label>Основная категория</label>
            <select id="prof-cat">
              <option>Игры</option>
              <option>Киберспорт</option>
              <option>Общение</option>
              <option>Развлечение</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Игра / Дисциплина</label>
          <input type="text" id="prof-game" placeholder="Например: CS2, Dota 2, Valorant" maxlength="40">
        </div>
        <div class="form-group">
          <label>О себе</label>
          <textarea id="prof-about" rows="3" placeholder="Ищу тиммейта для совместных игр..."></textarea>
        </div>
        <button class="btn-main" id="save-profile-btn" type="button">Сохранить данные</button>
      </div>
    </section>
  </main>

  <nav class="tabs" id="bottom-tabs">
    <button class="tab-btn active" data-tab="feed">Поиск</button>
    <button class="tab-btn" data-tab="chats">Сообщения</button>
    <button class="tab-btn" data-tab="profile">Профиль</button>
  </nav>

  <section id="chat-screen">
    <div class="chat-header">
      <button id="close-chat" style="font-size: 20px; padding: 4px 8px;">✕</button>
      <div style="font-weight: 700;" id="chat-target-name">Диалог</div>
    </div>
    <div class="messages-area" id="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="Написать сообщение...">
      <button class="btn-act" id="send-btn" type="button">Отправить</button>
    </div>
  </section>

  <script>
    const SUPABASE_URL = "https://gvpjiadxwqcjrkwsnzka.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_s51L6_hl1Lnirc3Tq7TYKQ_-0zPA9JC";

    let supabase = null;
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.warn("Supabase init error:", err);
    }

    const tg = window.Telegram?.WebApp;
    try { tg?.ready(); tg?.expand(); } catch(e) {}

    const myUid = tg?.initDataUnsafe?.user?.id ? "tg_" + tg.initDataUnsafe.user.id
      : (localStorage.getItem("app_uid") || (() => {
          const id = "u_" + Math.random().toString(36).substring(2, 9);
          localStorage.setItem("app_uid", id);
          return id;
        })());

    let activeTab = "feed";
    let activeChatWith = null;
    let realtimeChannel = null;

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tabId));
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === `view-${tabId}`));

      if (tabId === "feed") loadFeed();
      if (tabId === "chats") loadDialogs();
    }

    document.getElementById("bottom-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (btn) switchTab(btn.dataset.tab);
    });

    async function loadFeed() {
      const container = document.getElementById("feed-list");
      if (!supabase) {
        container.innerHTML = `<div class="empty-state">Ошибка инициализации базы данных.</div>`;
        return;
      }

      try {
        const { data, error } = await supabase
          .from("profiles")
          .select("*")
          .neq("id", myUid)
          .order("created_at", { ascending: false });

        if (error) {
          container.innerHTML = `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
          return;
        }

        if (!data || data.length === 0) {
          container.innerHTML = `<div class="empty-state">Игроки не найдены. Перейдите во вкладку «Профиль» и опубликуйте первую анкету!</div>`;
          return;
        }

        container.innerHTML = data.map(mate => `
          <div class="mate-row">
            <div class="avatar">${(mate.name || "?")[0].toUpperCase()}</div>
            <div class="mate-info">
              <div class="mate-title">
                <span>${escapeHtml(mate.name)}, ${mate.age || ""}</span>
                <span class="badge">${escapeHtml(mate.category || "Игры")}</span>
              </div>
              <div class="mate-desc"><b>${escapeHtml(mate.game || "")}</b>: ${escapeHtml(mate.about || "")}</div>
            </div>
            <button class="btn-act chat-trigger" data-id="${mate.id}" data-name="${encodeURIComponent(mate.name)}">Написать</button>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<div class="empty-state">Ошибка соединения: ${err.message}</div>`;
      }
    }

    document.getElementById("save-profile-btn").onclick = async () => {
      const name = document.getElementById("prof-name").value.trim();
      const age = parseInt(document.getElementById("prof-age").value, 10);
      const category = document.getElementById("prof-cat").value;
      const game = document.getElementById("prof-game").value.trim();
      const about = document.getElementById("prof-about").value.trim();

      if (!name || !game) {
        alert("Заполните никнейм и игру!");
        return;
      }

      const profileData = { id: myUid, name, age, category, game, about };
      localStorage.setItem("local_profile", JSON.stringify(profileData));

      if (supabase) {
        const { error } = await supabase.from("profiles").upsert(profileData);
        if (error) {
          alert("Ошибка сохранения: " + error.message);
          return;
        }
      }

      alert("Профиль успешно сохранен!");
      switchTab("feed");
    };

    function openChat(targetId, rawName) {
      activeChatWith = targetId;
      document.getElementById("chat-target-name").innerText = decodeURIComponent(rawName);
      document.getElementById("chat-messages").innerHTML = "";
      document.getElementById("chat-screen").classList.add("on");

      loadChatMessages(targetId);

      if (supabase) {
        if (realtimeChannel) supabase.removeChannel(realtimeChannel);
        realtimeChannel = supabase.channel(`chat_${targetId}`)
          .on("postgres_changes", {
            event: "INSERT",
            schema: "public",
            table: "messages"
          }, payload => {
            const msg = payload.new;
            if ((msg.sender_id === myUid && msg.receiver_id === targetId) ||
                (msg.sender_id === targetId && msg.receiver_id === myUid)) {
              appendMessage(msg);
            }
          })
          .subscribe();
      }
    }

    async function loadChatMessages(targetId) {
      if (!supabase) return;
      const { data } = await supabase
        .from("messages")
        .select("*")
        .or(`and(sender_id.eq.${myUid},receiver_id.eq.${targetId}),and(sender_id.eq.${targetId},receiver_id.eq.${myUid})`)
        .order("created_at", { ascending: true });

      const area = document.getElementById("chat-messages");
      area.innerHTML = "";
      if (data) data.forEach(appendMessage);
    }

    function appendMessage(msg) {
      const area = document.getElementById("chat-messages");
      const isMine = msg.sender_id === myUid;
      const el = document.createElement("div");
      el.className = `msg ${isMine ? "mine" : "theirs"}`;
      el.textContent = msg.content;
      area.appendChild(el);
      area.scrollTop = area.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text || !activeChatWith || !supabase) return;

      input.value = "";
      await supabase.from("messages").insert({
        sender_id: myUid,
        receiver_id: activeChatWith,
        content: text
      });
    }

    document.getElementById("send-btn").onclick = sendMessage;
    document.getElementById("chat-input").onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };
    document.getElementById("close-chat").onclick = () => {
      document.getElementById("chat-screen").classList.remove("on");
      if (realtimeChannel && supabase) supabase.removeChannel(realtimeChannel);
    };

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".chat-trigger");
      if (btn) openChat(btn.dataset.id, btn.dataset.name);
    });

    async function loadDialogs() {
      const container = document.getElementById("chats-list");
      if (!supabase) return;

      const { data } = await supabase
        .from("messages")
        .select("sender_id, receiver_id, content, created_at")
        .or(`sender_id.eq.${myUid},receiver_id.eq.${myUid}`)
        .order("created_at", { ascending: false });

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="empty-state">Нет активных переписок.</div>`;
        return;
      }

      const userMap = new Set();
      data.forEach(m => userMap.add(m.sender_id === myUid ? m.receiver_id : m.sender_id));

      const { data: profiles } = await supabase.from("profiles").select("*").in("id", Array.from(userMap));
      if (!profiles || profiles.length === 0) {
        container.innerHTML = `<div class="empty-state">Собеседники не найдены.</div>`;
        return;
      }

      container.innerHTML = profiles.map(p => `
        <div class="mate-row chat-trigger" data-id="${p.id}" data-name="${encodeURIComponent(p.name)}" style="cursor:pointer">
          <div class="avatar">${(p.name || "?")[0].toUpperCase()}</div>
          <div class="mate-info">
            <div class="mate-title">${escapeHtml(p.name)}</div>
            <div class="mate-desc">Открыть переписку</div>
          </div>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    window.addEventListener("DOMContentLoaded", async () => {
      let profile = null;
      try {
        const local = localStorage.getItem("local_profile");
        if (local) profile = JSON.parse(local);
      } catch(e) {}

      if (supabase) {
        try {
          const { data } = await supabase.from("profiles").select("*").eq("id", myUid).single();
          if (data) profile = data;
        } catch(e) {}
      }

      if (profile) {
        document.getElementById("prof-name").value = profile.name || "";
        document.getElementById("prof-age").value = profile.age || "";
        document.getElementById("prof-cat").value = profile.category || "Игры";
        document.getElementById("prof-game").value = profile.game || "";
        document.getElementById("prof-about").value = profile.about || "";
      }

      loadFeed();
    });
  </script>
</body>
</html>
