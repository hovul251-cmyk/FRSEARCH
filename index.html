<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FRSearch — Поиск тиммейтов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --surface: #141829;
      --surface-hover: #1c223a;
      --border: #262d4d;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --ok: #22c55e;
      --err: #ef4444;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.14) 0%, transparent 45%);
      background-attachment: fixed;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 13, 23, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand span { color: var(--accent); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .filter-select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    main {
      flex: 1;
      padding: 16px 16px 96px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    .screen-section { display: none; }
    .screen-section.active { display: block; }

    .mate-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mate-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.2s, background 0.2s;
    }
    .mate-row:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      flex-shrink: 0;
      color: #fff;
    }

    .mate-info { flex: 1; min-width: 0; }

    .mate-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
    }

    .mate-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.35;
      word-break: break-word;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      transition: transform 0.1s, background 0.2s;
      flex-shrink: 0;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.95); }

    .btn-block {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(14, 17, 30, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 14px 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .nav-btn.active { color: var(--accent); }

    .chat-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: none;
      flex-direction: column;
    }
    .chat-modal.open { display: flex; }

    .chat-top {
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }
    .bubble.me {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.them {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .chat-bottom {
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    #toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      transition: transform 0.25s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .empty-box {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 14px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>

  <div id="toast">Уведомление</div>

  <header>
    <div class="brand">
      <div class="status-dot" id="db-dot" title="Статус базы"></div>
      FR<span>Search</span>
    </div>
    <select class="filter-select" id="cat-filter">
      <option value="Все">Все категории</option>
      <option value="Игры">Игры</option>
      <option value="Киберспорт">Киберспорт</option>
      <option value="Общение">Общение</option>
      <option value="Развлечение">Развлечение</option>
    </select>
  </header>

  <main>
    <section id="sec-feed" class="screen-section active">
      <div class="mate-list" id="feed-container"></div>
    </section>

    <section id="sec-chats" class="screen-section">
      <div class="mate-list" id="chats-container"></div>
    </section>

    <section id="sec-profile" class="screen-section">
      <div class="form-card">
        <h3 style="margin-bottom: 14px; font-size: 17px;">Моя заявка в поиске</h3>
        <div class="form-group">
          <label>Ваш никнейм *</label>
          <input type="text" id="in-name" placeholder="Например: Shadow" maxlength="30">
        </div>
        <div style="display: flex; gap: 10px;" class="form-group">
          <div style="flex: 1;">
            <label>Возраст</label>
            <input type="number" id="in-age" placeholder="18" min="12" max="99">
          </div>
          <div style="flex: 1;">
            <label>Категория</label>
            <select id="in-cat">
              <option value="Игры">Игры</option>
              <option value="Киберспорт">Киберспорт</option>
              <option value="Общение">Общение</option>
              <option value="Развлечение">Развлечение</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Игра / Дисциплина *</label>
          <input type="text" id="in-game" placeholder="CS2, Dota 2, Valorant..." maxlength="40">
        </div>
        <div class="form-group">
          <label>Кого ищете / О себе</label>
          <textarea id="in-about" rows="3" placeholder="Ищу +1 в стак на вечер, связь Discord..."></textarea>
        </div>
        <button type="button" class="btn btn-block" id="btn-save">Опубликовать в список</button>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" id="nav-feed"><span>Поиск</span></button>
    <button type="button" class="nav-btn" id="nav-chats"><span>Диалоги</span></button>
    <button type="button" class="nav-btn" id="nav-profile"><span>Профиль</span></button>
  </nav>

  <div class="chat-modal" id="chat-modal">
    <div class="chat-top">
      <button type="button" class="back-btn" id="btn-close-chat">← Назад</button>
      <div style="font-weight: 700; font-size: 16px;" id="chat-title">Игрок</div>
    </div>
    <div class="chat-messages" id="chat-box"></div>
    <div class="chat-bottom">
      <input type="text" id="chat-input" placeholder="Введите сообщение...">
      <button type="button" class="btn" id="btn-send">Отправить</button>
    </div>
  </div>

  <script>
    (function() {
      const SUPABASE_URL = "https://gvpjiadxwqcjrkwsnzka.supabase.co";
      const SUPABASE_KEY = "sb_publishable_s51L6_hl1Lnirc3Tq7TYKQ_-0zPA9JC";

      let sbClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === "function") {
          sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }
      } catch (e) {
        console.warn("Supabase Init Warning:", e);
      }

      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {}

      function getMyUid() {
        try {
          const tgId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
          if (tgId) return "tg_" + tgId;
          let saved = localStorage.getItem("frs_uid");
          if (!saved) {
            saved = "u_" + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("frs_uid", saved);
          }
          return saved;
        } catch (e) {
          return "u_guest";
        }
      }
      const myUid = getMyUid();

      const DEMO_PLAYERS = [
        { id: "d1", name: "Артём", age: 20, category: "Киберспорт", game: "CS2", about: "Faceit 8 lvl, ищу стак на вечер со связью" },
        { id: "d2", name: "Алина", age: 21, category: "Игры", game: "Valorant / Genshin", about: "Играю по вечерам, без токсичности" },
        { id: "d3", name: "Максим", age: 24, category: "Игры", game: "Dota 2", about: "Позиция 1/2, 5500 MMR, ищу саппорта в пати" },
        { id: "d4", name: "София", age: 19, category: "Общение", game: "Discord / Co-op", about: "Поболтать и поиграть в кооп-хорроры" }
      ];

      let currentCategory = "Все";
      let currentChatPartner = null;

      function notify(msg) {
        const t = document.getElementById("toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => t.classList.remove("show"), 2500);
      }

      function esc(str) {
        return String(str || "").replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
      }

      function openTab(tabName) {
        ["feed", "chats", "profile"].forEach(t => {
          const sec = document.getElementById("sec-" + t);
          const btn = document.getElementById("nav-" + t);
          if (sec) sec.classList.toggle("active", t === tabName);
          if (btn) btn.classList.toggle("active", t === tabName);
        });

        const filterEl = document.getElementById("cat-filter");
        if (filterEl) filterEl.style.visibility = (tabName === "feed") ? "visible" : "hidden";

        if (tabName === "feed") renderFeed();
        if (tabName === "chats") renderChatsList();
      }

      document.getElementById("nav-feed").addEventListener("click", () => openTab("feed"));
      document.getElementById("nav-chats").addEventListener("click", () => openTab("chats"));
      document.getElementById("nav-profile").addEventListener("click", () => openTab("profile"));

      document.getElementById("cat-filter").addEventListener("change", (e) => {
        currentCategory = e.target.value;
        renderFeed();
      });

      async function renderFeed() {
        const box = document.getElementById("feed-container");
        box.innerHTML = `<div class="empty-box">Обновление списка...</div>`;

        let list = [];

        if (sbClient) {
          try {
            const { data, error } = await sbClient
              .from("profiles")
              .select("*")
              .order("created_at", { ascending: false });

            if (!error && Array.isArray(data)) {
              list = data;
              document.getElementById("db-dot").style.background = "#22c55e";
            } else {
              document.getElementById("db-dot").style.background = "#eab308";
            }
          } catch (e) {
            document.getElementById("db-dot").style.background = "#ef4444";
          }
        }

        try {
          const localProf = JSON.parse(localStorage.getItem("frs_profile") || "null");
          if (localProf && !list.some(x => x.id === localProf.id)) {
            list.unshift(localProf);
          }
        } catch (e) {}

        DEMO_PLAYERS.forEach(d => {
          if (!list.some(x => x.id === d.id)) list.push(d);
        });

        if (currentCategory !== "Все") {
          list = list.filter(item => item.category === currentCategory);
        }

        if (list.length === 0) {
          box.innerHTML = `<div class="empty-box">В этой категории пока нет заявок.</div>`;
          return;
        }

        box.innerHTML = list.map(p => {
          const isMe = p.id === myUid;
          return `
            <div class="mate-row">
              <div class="avatar">${esc((p.name || "?")[0].toUpperCase())}</div>
              <div class="mate-info">
                <div class="mate-title">
                  <span>${esc(p.name)}${p.age ? ", " + esc(p.age) : ""} ${isMe ? "(Вы)" : ""}</span>
                  <span class="badge">${esc(p.category || "Игры")}</span>
                </div>
                <div class="mate-desc"><b>${esc(p.game)}</b> — ${esc(p.about || "Ищу команду")}</div>
              </div>
              ${isMe 
                ? `<button type="button" class="btn" data-edit="1">Изменить</button>` 
                : `<button type="button" class="btn" data-chat-id="${esc(p.id)}" data-chat-name="${esc(p.name)}">Написать</button>`
              }
            </div>
          `;
        }).join("");
      }

      document.getElementById("feed-container").addEventListener("click", (e) => {
        const editBtn = e.target.closest("[data-edit]");
        if (editBtn) {
          openTab("profile");
          return;
        }
        const chatBtn = e.target.closest("[data-chat-id]");
        if (chatBtn) {
          openChatModal(chatBtn.getAttribute("data-chat-id"), chatBtn.getAttribute("data-chat-name"));
        }
      });

      document.getElementById("btn-save").addEventListener("click", async () => {
        const name = document.getElementById("in-name").value.trim();
        const age = parseInt(document.getElementById("in-age").value, 10) || 18;
        const category = document.getElementById("in-cat").value;
        const game = document.getElementById("in-game").value.trim();
        const about = document.getElementById("in-about").value.trim() || "Ищу тиммейтов";

        if (!name || !game) {
          notify("Пожалуйста, укажите никнейм и игру!");
          return;
        }

        const profileObj = { id: myUid, name, age, category, game, about };

        try {
          localStorage.setItem("frs_profile", JSON.stringify(profileObj));
        } catch (e) {}

        if (sbClient) {
          try {
            await sbClient.from("profiles").upsert(profileObj);
          } catch (e) {}
        }

        notify("Анкета опубликована!");
        openTab("feed");
      });

      function getLocalMessages() {
        try {
          return JSON.parse(localStorage.getItem("frs_msgs") || "[]");
        } catch (e) {
          return [];
        }
      }

      function saveLocalMessage(msg) {
        try {
          const arr = getLocalMessages();
          arr.push(msg);
          localStorage.setItem("frs_msgs", JSON.stringify(arr));
        } catch (e) {}
      }

      async function openChatModal(partnerId, partnerName) {
        currentChatPartner = { id: partnerId, name: partnerName };
        document.getElementById("chat-title").textContent = partnerName || "Игрок";
        document.getElementById("chat-modal").classList.add("open");
        await loadConversation(partnerId);
      }

      document.getElementById("btn-close-chat").addEventListener("click", () => {
        document.getElementById("chat-modal").classList.remove("open");
        currentChatPartner = null;
      });

      async function loadConversation(partnerId) {
        const box = document.getElementById("chat-box");
        box.innerHTML = "";

        let msgs = [];

        if (sbClient) {
          try {
            const { data, error } = await sbClient
              .from("messages")
              .select("*")
              .or(`and(sender_id.eq.${myUid},receiver_id.eq.${partnerId}),and(sender_id.eq.${partnerId},receiver_id.eq.${myUid})`)
              .order("created_at", { ascending: true });
            if (!error && Array.isArray(data)) msgs = data;
          } catch (e) {}
        }

        const local = getLocalMessages().filter(m =>
          (m.sender_id === myUid && m.receiver_id === partnerId) ||
          (m.sender_id === partnerId && m.receiver_id === myUid)
        );

        const combined = msgs.length ? msgs : local;

        if (combined.length === 0) {
          box.innerHTML = `<div class="empty-box">Напишите первое сообщение игроку ${esc(currentChatPartner.name)}!</div>`;
          return;
        }

        combined.forEach(m => appendBubble(m.content, m.sender_id === myUid));
      }

      function appendBubble(text, isMe) {
        const box = document.getElementById("chat-box");
        const empty = box.querySelector(".empty-box");
        if (empty) empty.remove();

        const div = document.createElement("div");
        div.className = "bubble " + (isMe ? "me" : "them");
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      async function handleSend() {
        const input = document.getElementById("chat-input");
        const text = input.value.trim();
        if (!text || !currentChatPartner) return;

        input.value = "";
        const partner = currentChatPartner;

        const msgObj = {
          sender_id: myUid,
          receiver_id: partner.id,
          content: text,
          receiver_name: partner.name,
          ts: Date.now()
        };

        appendBubble(text, true);
        saveLocalMessage(msgObj);

        if (sbClient) {
          try {
            await sbClient.from("messages").insert({
              sender_id: myUid,
              receiver_id: partner.id,
              content: text
            });
          } catch (e) {}
        }

        if (partner.id.startsWith("d")) {
          setTimeout(() => {
            const replies = [
              "Привет! Го в дискорд, я сейчас в сети.",
              "Привет, кидай пати!",
              "Отлично, через 10 минут запускаю катку.",
              "Добавляйся, сыграем пару матчей!"
            ];
            const replyText = replies[Math.floor(Math.random() * replies.length)];
            const replyMsg = {
              sender_id: partner.id,
              receiver_id: myUid,
              content: replyText,
              receiver_name: partner.name,
              ts: Date.now()
            };
            saveLocalMessage(replyMsg);
            if (currentChatPartner && currentChatPartner.id === partner.id) {
              appendBubble(replyText, false);
            } else {
              notify("Новое сообщение от " + partner.name);
            }
          }, 900);
        }
      }

      document.getElementById("btn-send").addEventListener("click", handleSend);
      document.getElementById("chat-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleSend();
      });

      async function renderChatsList() {
        const box = document.getElementById("chats-container");
        const allLocal = getLocalMessages();

        const map = new Map();
        allLocal.forEach(m => {
          const isMe = m.sender_id === myUid;
          const pid = isMe ? m.receiver_id : m.sender_id;
          const pname = m.receiver_name || (DEMO_PLAYERS.find(d => d.id === pid)?.name) || "Игрок";
          map.set(pid, { id: pid, name: pname, last: m.content });
        });

        if (map.size === 0) {
          box.innerHTML = `<div class="empty-box">У вас пока нет активных переписок.<br>Нажмите «Написать» рядом с любым игроком в Поиске!</div>`;
          return;
        }

        box.innerHTML = Array.from(map.values()).reverse().map(item => `
          <div class="mate-row" style="cursor: pointer;" data-open-id="${esc(item.id)}" data-open-name="${esc(item.name)}">
            <div class="avatar">${esc(item.name[0].toUpperCase())}</div>
            <div class="mate-info">
              <div class="mate-title">${esc(item.name)}</div>
              <div class="mate-desc">${esc(item.last)}</div>
            </div>
            <button type="button" class="btn">Открыть</button>
          </div>
        `).join("");
      }

      document.getElementById("chats-container").addEventListener("click", (e) => {
        const row = e.target.closest("[data-open-id]");
        if (row) {
          openChatModal(row.getAttribute("data-open-id"), row.getAttribute("data-open-name"));
        }
      });

      try {
        const savedProf = JSON.parse(localStorage.getItem("frs_profile") || "null");
        if (savedProf) {
          document.getElementById("in-name").value = savedProf.name || "";
          document.getElementById("in-age").value = savedProf.age || "";
          document.getElementById("in-cat").value = savedProf.category || "Игры";
          document.getElementById("in-game").value = savedProf.game || "";
          document.getElementById("in-about").value = savedProf.about || "";
        }
      } catch (e) {}

      renderFeed();
    })();
  </script>
</body>
</html>
