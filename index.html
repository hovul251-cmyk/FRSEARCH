<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FRSearch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --card-bg: rgba(22, 26, 46, 0.85);
      --card-hover: rgba(30, 36, 64, 0.95);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Фоновый градиент строго на заднем плане */
    .bg-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 15% 10%, rgba(99,102,241,0.2) 0%, transparent 45%),
                  radial-gradient(circle at 85% 90%, rgba(139,92,246,0.18) 0%, transparent 50%);
      pointer-events: none !important;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      padding: max(14px, env(safe-area-inset-top)) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 13, 23, 0.9);
      backdrop-filter: blur(12px);
    }
    .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }

    .cat-btn {
      padding: 7px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .views {
      position: relative;
      flex: 1;
      overflow-y: auto;
      z-index: 5;
    }

    .view {
      display: none;
      padding: 16px 16px 100px;
    }
    .view.active { display: block; }

    .mate-list { display: flex; flex-direction: column; gap: 10px; }
    .mate-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .mate-info { flex: 1; min-width: 0; }
    .mate-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
    .mate-desc { font-size: 13px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    button {
      font: inherit;
      color: inherit;
      border: none;
      cursor: pointer;
      user-select: none;
    }

    .btn-act {
      padding: 9px 14px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .btn-act:active { transform: scale(0.96); }

    /* Навигация строго поверх остального */
    .tabs {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(11, 13, 23, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }
    .tab-btn {
      padding: 16px 0 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      background: transparent;
      transition: color 0.15s;
    }
    .tab-btn.active { color: var(--accent); }

    /* Форма профиля */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      background: rgba(15, 18, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }
    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      margin-top: 10px;
    }
    .btn-main:active { transform: scale(0.98); }

    /* Чат */
    #chat-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    #chat-screen.on { display: flex; }
    .chat-header {
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 18, 33, 0.9);
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      word-wrap: break-word;
    }
    .msg.mine { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.theirs { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }
    .chat-input-bar {
      padding: 12px 14px max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: rgba(11, 13, 23, 0.95);
    }
    .empty-state { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <header>
    <div class="brand">FR<span>Search</span></div>
    <button class="cat-btn" id="cat-selector" onclick="alert('Фильтры: Все категории')">Все категории</button>
  </header>

  <main class="views">
    <!-- Поиск -->
    <section class="view active" id="view-feed">
      <div class="mate-list" id="feed-list">
        <div class="empty-state">Загрузка данных...</div>
      </div>
    </section>

    <!-- Сообщения -->
    <section class="view" id="view-chats">
      <div class="mate-list" id="chats-list">
        <div class="empty-state">Диалогов пока нет.</div>
      </div>
    </section>

    <!-- Профиль -->
    <section class="view" id="view-profile">
      <div style="max-width: 440px; margin: 0 auto;">
        <div class="form-group">
          <label>Никнейм</label>
          <input type="text" id="prof-name" placeholder="Ваш никнейм" maxlength="30">
        </div>
        <div style="display: flex; gap: 10px;" class="form-group">
          <div style="flex: 1;">
            <label>Возраст</label>
            <input type="number" id="prof-age" placeholder="18" min="12" max="99">
          </div>
          <div style="flex: 1;">
            <label>Категория</label>
            <select id="prof-cat">
              <option>Игры</option>
              <option>Киберспорт</option>
              <option>Общение</option>
              <option>Развлечение</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Игра / Дисциплина</label>
          <input type="text" id="prof-game" placeholder="CS2, Dota 2, Valorant" maxlength="40">
        </div>
        <div class="form-group">
          <label>О себе</label>
          <textarea id="prof-about" rows="3" placeholder="Кого вы ищете в команду..."></textarea>
        </div>
        <button class="btn-main" type="button" onclick="saveProfile()">Сохранить анкету</button>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab-btn active" id="tab-feed" type="button" onclick="switchTab('feed')">Поиск</button>
    <button class="tab-btn" id="tab-chats" type="button" onclick="switchTab('chats')">Сообщения</button>
    <button class="tab-btn" id="tab-profile" type="button" onclick="switchTab('profile')">Профиль</button>
  </nav>

  <!-- Окно чата -->
  <section id="chat-screen">
    <div class="chat-header">
      <button onclick="closeChat()" style="font-size: 20px; padding: 4px 10px;">✕</button>
      <div style="font-weight: 700;" id="chat-target-name">Диалог</div>
    </div>
    <div class="messages-area" id="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="Написать сообщение...">
      <button class="btn-act" type="button" onclick="sendMessage()">Отправить</button>
    </div>
  </section>

  <script>
    const SUPABASE_URL = "https://gvpjiadxwqcjrkwsnzka.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_s51L6_hl1Lnirc3Tq7TYKQ_-0zPA9JC";

    let supabase = null;
    try {
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.error("Supabase client err:", err);
    }

    const tg = window.Telegram?.WebApp;
    try { tg?.ready(); tg?.expand(); } catch(e) {}

    const myUid = tg?.initDataUnsafe?.user?.id ? "tg_" + tg.initDataUnsafe.user.id
      : (localStorage.getItem("app_uid") || (() => {
          const id = "u_" + Math.random().toString(36).substring(2, 9);
          localStorage.setItem("app_uid", id);
          return id;
        })());

    let activeTab = "feed";
    let activeChatWith = null;

    // Гарантированное переключение табов через onclick
    window.switchTab = function(tabId) {
      activeTab = tabId;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));

      const targetBtn = document.getElementById("tab-" + tabId);
      const targetView = document.getElementById("view-" + tabId);
      if (targetBtn) targetBtn.classList.add("active");
      if (targetView) targetView.classList.add("active");

      if (tabId === "feed") loadFeed();
      if (tabId === "chats") loadDialogs();
    };

    // Загрузка анкет
    window.loadFeed = async function() {
      const container = document.getElementById("feed-list");
      if (!supabase) {
        container.innerHTML = `<div class="empty-state">Ошибка инициализации базы данных.</div>`;
        return;
      }

      try {
        const { data, error } = await supabase
          .from("profiles")
          .select("*")
          .neq("id", myUid)
          .order("created_at", { ascending: false });

        if (error) {
          container.innerHTML = `<div class="empty-state">Ошибка Supabase: ${error.message}</div>`;
          return;
        }

        if (!data || data.length === 0) {
          container.innerHTML = `<div class="empty-state">Пока нет других анкет.<br>Заполните вкладку «Профиль»!</div>`;
          return;
        }

        container.innerHTML = data.map(mate => `
          <div class="mate-row">
            <div class="avatar">${(mate.name || "?")[0].toUpperCase()}</div>
            <div class="mate-info">
              <div class="mate-title">
                <span>${esc(mate.name)}, ${mate.age || ""}</span>
                <span class="badge">${esc(mate.category || "Игры")}</span>
              </div>
              <div class="mate-desc"><b>${esc(mate.game || "")}</b>: ${esc(mate.about || "")}</div>
            </div>
            <button class="btn-act" type="button" onclick="openChat('${mate.id}', '${encodeURIComponent(mate.name)}')">Написать</button>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<div class="empty-state">Ошибка сети: ${err.message}</div>`;
      }
    };

    // Сохранение профиля
    window.saveProfile = async function() {
      const name = document.getElementById("prof-name").value.trim();
      const age = parseInt(document.getElementById("prof-age").value, 10);
      const category = document.getElementById("prof-cat").value;
      const game = document.getElementById("prof-game").value.trim();
      const about = document.getElementById("prof-about").value.trim();

      if (!name || !game) {
        alert("Заполните имя и игру!");
        return;
      }

      const pData = { id: myUid, name, age, category, game, about };
      localStorage.setItem("local_prof", JSON.stringify(pData));

      if (supabase) {
        const { error } = await supabase.from("profiles").upsert(pData);
        if (error) {
          alert("Ошибка сохранения: " + error.message);
          return;
        }
      }

      alert("Профиль сохранен!");
      switchTab("feed");
    };

    // Чат
    window.openChat = function(targetId, rawName) {
      activeChatWith = targetId;
      document.getElementById("chat-target-name").innerText = decodeURIComponent(rawName);
      document.getElementById("chat-messages").innerHTML = "";
      document.getElementById("chat-screen").classList.add("on");
      loadChatMessages(targetId);
    };

    window.closeChat = function() {
      document.getElementById("chat-screen").classList.remove("on");
      activeChatWith = null;
    };

    async function loadChatMessages(targetId) {
      if (!supabase) return;
      const { data } = await supabase
        .from("messages")
        .select("*")
        .or(`and(sender_id.eq.${myUid},receiver_id.eq.${targetId}),and(sender_id.eq.${targetId},receiver_id.eq.${myUid})`)
        .order("created_at", { ascending: true });

      const area = document.getElementById("chat-messages");
      area.innerHTML = "";
      if (data) data.forEach(appendMessage);
    }

    function appendMessage(msg) {
      const area = document.getElementById("chat-messages");
      const isMine = msg.sender_id === myUid;
      const el = document.createElement("div");
      el.className = `msg ${isMine ? "mine" : "theirs"}`;
      el.textContent = msg.content;
      area.appendChild(el);
      area.scrollTop = area.scrollHeight;
    }

    window.sendMessage = async function() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text || !activeChatWith || !supabase) return;

      input.value = "";
      const { data, error } = await supabase.from("messages").insert({
        sender_id: myUid,
        receiver_id: activeChatWith,
        content: text
      }).select();

      if (data && data[0]) appendMessage(data[0]);
      if (error) alert("Ошибка отправки: " + error.message);
    };

    document.getElementById("chat-input").onkeydown = e => { if (e.key === "Enter") sendMessage(); };

    window.loadDialogs = async function() {
      const container = document.getElementById("chats-list");
      if (!supabase) return;

      const { data } = await supabase
        .from("messages")
        .select("sender_id, receiver_id")
        .or(`sender_id.eq.${myUid},receiver_id.eq.${myUid}`);

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="empty-state">Нет активных переписок.</div>`;
        return;
      }

      const userMap = new Set();
      data.forEach(m => userMap.add(m.sender_id === myUid ? m.receiver_id : m.sender_id));

      const { data: profiles } = await supabase.from("profiles").select("*").in("id", Array.from(userMap));
      if (!profiles || profiles.length === 0) {
        container.innerHTML = `<div class="empty-state">Диалогов пока нет.</div>`;
        return;
      }

      container.innerHTML = profiles.map(p => `
        <div class="mate-row" onclick="openChat('${p.id}', '${encodeURIComponent(p.name)}')" style="cursor:pointer">
          <div class="avatar">${(p.name || "?")[0].toUpperCase()}</div>
          <div class="mate-info">
            <div class="mate-title">${esc(p.name)}</div>
            <div class="mate-desc">Нажмите, чтобы продолжить чат</div>
          </div>
        </div>
      `).join("");
    };

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Инициализация при открытии
    window.addEventListener("DOMContentLoaded", () => {
      let local = null;
      try { local = JSON.parse(localStorage.getItem("local_prof")); } catch(e) {}
      if (local) {
        document.getElementById("prof-name").value = local.name || "";
        document.getElementById("prof-age").value = local.age || "";
        document.getElementById("prof-cat").value = local.category || "Игры";
        document.getElementById("prof-game").value = local.game || "";
        document.getElementById("prof-about").value = local.about || "";
      }
      loadFeed();
    });
  </script>
</body>
</html>
