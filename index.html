<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FRSearch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0d17;
      --card-bg: rgba(22, 26, 46, 0.85);
      --card-hover: rgba(30, 36, 64, 0.95);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      /* Использование dvh решает проблемы со скроллом и кликами в TG WebApp */
      height: 100dvh; 
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 15% 10%, rgba(99,102,241,0.2) 0%, transparent 45%),
                  radial-gradient(circle at 85% 90%, rgba(139,92,246,0.18) 0%, transparent 50%);
      pointer-events: none !important;
      z-index: 1;
    }

    header {
      position: relative;
      z-index: 10;
      padding: max(14px, env(safe-area-inset-top)) 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 13, 23, 0.95);
    }
    .brand { font-size: 20px; font-weight: 800; }
    .brand span { color: var(--accent); }

    .views {
      position: relative;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 5;
      padding-bottom: 90px; /* Отступ под меню */
    }

    .view {
      display: none;
      padding: 16px;
    }
    .view.active { display: block; }

    .mate-list { display: flex; flex-direction: column; gap: 10px; }
    .mate-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      position: relative;
      z-index: 10;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .mate-info { flex: 1; min-width: 0; }
    .mate-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
    .mate-desc { font-size: 13px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    button {
      font: inherit;
      color: inherit;
      border: none;
      background: none;
      cursor: pointer;
      position: relative;
      z-index: 20;
    }

    .btn-act {
      padding: 9px 14px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
    }
    .btn-act:active { transform: scale(0.96); }

    .tabs {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: rgba(11, 13, 23, 0.98);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }
    .tab-btn {
      padding: 16px 0 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      transition: color 0.15s;
    }
    .tab-btn.active { color: var(--accent); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      background: rgba(15, 18, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font: inherit;
      outline: none;
      position: relative;
      z-index: 20;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    
    .btn-main {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      border-radius: 12px;
      margin-top: 10px;
    }

    #chat-screen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: none;
      flex-direction: column;
    }
    #chat-screen.on { display: flex; }
    .chat-header {
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 18, 33, 0.95);
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      word-wrap: break-word;
    }
    .msg.mine { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.theirs { align-self: flex-start; background: rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }
    .chat-input-bar {
      padding: 12px 14px max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
      background: rgba(11, 13, 23, 0.98);
    }
    .empty-state { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <header>
    <div class="brand">FR<span>Search</span></div>
    <div style="font-size: 12px; color: var(--text-muted)">beta</div>
  </header>

  <main class="views">
    <section class="view active" id="view-feed">
      <div class="mate-list" id="feed-list">
        <div class="empty-state">Загрузка данных...</div>
      </div>
    </section>

    <section class="view" id="view-chats">
      <div class="mate-list" id="chats-list">
        <div class="empty-state">Диалогов пока нет.</div>
      </div>
    </section>

    <section class="view" id="view-profile">
      <div style="max-width: 440px; margin: 0 auto;">
        <div class="form-group">
          <label>Никнейм</label>
          <input type="text" id="prof-name" placeholder="Ваш никнейм" maxlength="30">
        </div>
        <div style="display: flex; gap: 10px;" class="form-group">
          <div style="flex: 1;">
            <label>Возраст</label>
            <input type="number" id="prof-age" placeholder="18" min="12" max="99">
          </div>
          <div style="flex: 1;">
            <label>Категория</label>
            <select id="prof-cat">
              <option>Игры</option>
              <option>Киберспорт</option>
              <option>Общение</option>
              <option>Развлечение</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Игра / Дисциплина</label>
          <input type="text" id="prof-game" placeholder="CS2, Dota 2, Valorant" maxlength="40">
        </div>
        <div class="form-group">
          <label>О себе</label>
          <textarea id="prof-about" rows="3" placeholder="Кого вы ищете в команду..."></textarea>
        </div>
        <button class="btn-main" id="btn-save-profile">Сохранить анкету</button>
      </div>
    </section>
  </main>

  <nav class="tabs" id="main-tabs">
    <button class="tab-btn active" data-tab="feed">Поиск</button>
    <button class="tab-btn" data-tab="chats">Сообщения</button>
    <button class="tab-btn" data-tab="profile">Профиль</button>
  </nav>

  <section id="chat-screen">
    <div class="chat-header">
      <button id="btn-close-chat" style="font-size: 20px; padding: 4px 10px;">✕</button>
      <div style="font-weight: 700;" id="chat-target-name">Диалог</div>
    </div>
    <div class="messages-area" id="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="Написать сообщение...">
      <button class="btn-act" id="btn-send-message">Отправить</button>
    </div>
  </section>

  <script>
    // 1. Инициализация
    const SUPABASE_URL = "https://gvpjiadxwqcjrkwsnzka.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_s51L6_hl1Lnirc3Tq7TYKQ_-0zPA9JC";

    let supabase = null;
    let activeChatWith = null;

    try {
      const tg = window.Telegram?.WebApp;
      tg?.ready();
      tg?.expand();
    } catch(e) {}

    const myUid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id 
      ? "tg_" + window.Telegram.WebApp.initDataUnsafe.user.id
      : (localStorage.getItem("app_uid") || (() => {
          const id = "u_" + Math.random().toString(36).substring(2, 9);
          localStorage.setItem("app_uid", id);
          return id;
        })());

    // 2. Дожидаемся загрузки DOM для привязки событий
    document.addEventListener("DOMContentLoaded", () => {
      // Инициализируем БД
      if (window.supabase) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // Привязываем кнопки вкладок
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          switchTab(btn.dataset.tab);
        });
      });

      // Привязываем профиль
      const btnSave = document.getElementById("btn-save-profile");
      if (btnSave) btnSave.addEventListener("click", saveProfile);

      // Привязываем чат
      const btnClose = document.getElementById("btn-close-chat");
      if (btnClose) btnClose.addEventListener("click", closeChat);

      const btnSend = document.getElementById("btn-send-message");
      if (btnSend) btnSend.addEventListener("click", sendMessage);

      const inputChat = document.getElementById("chat-input");
      if (inputChat) {
        inputChat.addEventListener("keydown", (e) => {
          if (e.key === "Enter") sendMessage();
        });
      }

      // Глобальное делегирование кликов для динамических кнопок "Написать" и строк чатов
      document.addEventListener("click", (e) => {
        const trigger = e.target.closest(".chat-trigger");
        if (trigger) {
          openChat(trigger.dataset.id, trigger.dataset.name);
        }
      });

      // Загружаем профиль локально
      loadLocalProfile();
      // Загружаем стартовую ленту
      loadFeed();
    });

    // 3. Функции интерфейса
    function switchTab(tabId) {
      // Меняем активную кнопку
      document.querySelectorAll(".tab-btn").forEach(b => {
        if (b.dataset.tab === tabId) b.classList.add("active");
        else b.classList.remove("active");
      });
      // Меняем активный экран
      document.querySelectorAll(".view").forEach(v => {
        if (v.id === `view-${tabId}`) v.classList.add("active");
        else v.classList.remove("active");
      });

      if (tabId === "feed") loadFeed();
      if (tabId === "chats") loadDialogs();
    }

    async function saveProfile() {
      const name = document.getElementById("prof-name").value.trim();
      const age = parseInt(document.getElementById("prof-age").value, 10);
      const category = document.getElementById("prof-cat").value;
      const game = document.getElementById("prof-game").value.trim();
      const about = document.getElementById("prof-about").value.trim();

      if (!name || !game) {
        alert("Заполните никнейм и игру!");
        return;
      }

      const pData = { id: myUid, name, age, category, game, about };
      localStorage.setItem("local_prof", JSON.stringify(pData));

      if (supabase) {
        const { error } = await supabase.from("profiles").upsert(pData);
        if (error) {
          alert("Ошибка сохранения в базу: " + error.message);
          return;
        }
      }

      switchTab("feed");
    }

    function loadLocalProfile() {
      try {
        const local = JSON.parse(localStorage.getItem("local_prof"));
        if (local) {
          document.getElementById("prof-name").value = local.name || "";
          document.getElementById("prof-age").value = local.age || "";
          document.getElementById("prof-cat").value = local.category || "Игры";
          document.getElementById("prof-game").value = local.game || "";
          document.getElementById("prof-about").value = local.about || "";
        }
      } catch (e) {}
    }

    async function loadFeed() {
      const container = document.getElementById("feed-list");
      if (!supabase) {
        container.innerHTML = `<div class="empty-state">База данных не подключена</div>`;
        return;
      }

      const { data, error } = await supabase
        .from("profiles")
        .select("*")
        .neq("id", myUid)
        .order("created_at", { ascending: false });

      if (error) {
        container.innerHTML = `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="empty-state">Пока нет других анкет.<br>Заполните вкладку «Профиль»!</div>`;
        return;
      }

      container.innerHTML = data.map(mate => `
        <div class="mate-row">
          <div class="avatar">${(mate.name || "?")[0].toUpperCase()}</div>
          <div class="mate-info">
            <div class="mate-title">
              <span>${esc(mate.name)}, ${mate.age || ""}</span>
              <span class="badge">${esc(mate.category || "Игры")}</span>
            </div>
            <div class="mate-desc"><b>${esc(mate.game || "")}</b>: ${esc(mate.about || "")}</div>
          </div>
          <button class="btn-act chat-trigger" data-id="${mate.id}" data-name="${encodeURIComponent(mate.name)}">Написать</button>
        </div>
      `).join("");
    }

    // 4. Логика чатов
    function openChat(targetId, rawName) {
      activeChatWith = targetId;
      document.getElementById("chat-target-name").innerText = decodeURIComponent(rawName);
      document.getElementById("chat-messages").innerHTML = "";
      document.getElementById("chat-screen").classList.add("on");
      loadChatMessages(targetId);
    }

    function closeChat() {
      document.getElementById("chat-screen").classList.remove("on");
      activeChatWith = null;
    }

    async function loadChatMessages(targetId) {
      if (!supabase) return;
      const { data } = await supabase
        .from("messages")
        .select("*")
        .or(`and(sender_id.eq.${myUid},receiver_id.eq.${targetId}),and(sender_id.eq.${targetId},receiver_id.eq.${myUid})`)
        .order("created_at", { ascending: true });

      const area = document.getElementById("chat-messages");
      area.innerHTML = "";
      if (data) data.forEach(appendMessage);
    }

    function appendMessage(msg) {
      const area = document.getElementById("chat-messages");
      const isMine = msg.sender_id === myUid;
      const el = document.createElement("div");
      el.className = `msg ${isMine ? "mine" : "theirs"}`;
      el.textContent = msg.content;
      area.appendChild(el);
      area.scrollTop = area.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text || !activeChatWith || !supabase) return;

      input.value = "";
      
      const tempMsg = { sender_id: myUid, content: text };
      appendMessage(tempMsg);

      await supabase.from("messages").insert({
        sender_id: myUid,
        receiver_id: activeChatWith,
        content: text
      });
    }

    async function loadDialogs() {
      const container = document.getElementById("chats-list");
      if (!supabase) return;

      const { data } = await supabase
        .from("messages")
        .select("sender_id, receiver_id")
        .or(`sender_id.eq.${myUid},receiver_id.eq.${myUid}`);

      if (!data || data.length === 0) {
        container.innerHTML = `<div class="empty-state">Нет активных переписок.</div>`;
        return;
      }

      const userMap = new Set();
      data.forEach(m => userMap.add(m.sender_id === myUid ? m.receiver_id : m.sender_id));

      const { data: profiles } = await supabase.from("profiles").select("*").in("id", Array.from(userMap));
      if (!profiles || profiles.length === 0) {
        container.innerHTML = `<div class="empty-state">Диалогов пока нет.</div>`;
        return;
      }

      container.innerHTML = profiles.map(p => `
        <div class="mate-row chat-trigger" style="cursor:pointer" data-id="${p.id}" data-name="${encodeURIComponent(p.name)}">
          <div class="avatar">${(p.name || "?")[0].toUpperCase()}</div>
          <div class="mate-info">
            <div class="mate-title">${esc(p.name)}</div>
            <div class="mate-desc" style="color: var(--accent);">Открыть диалог</div>
          </div>
        </div>
      `).join("");
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
  </script>
</body>
</html>
